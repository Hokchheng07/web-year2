<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">M2-Year2 study project logo</title>
  <desc id="logo-description">A clean blue open-book emblem with a subtle code symbol, beside the text M2-Year2.</desc>

  <!-- Open pages -->
  <path d="M66 82c14-7 34-6 54 6v57c-20-10-39-11-54-5V82Z" fill="#2563EB"/>
  <path d="M120 88c20-12 40-13 54-6v58c-15-6-34-5-54 5V88Z" fill="#2563EB"/>
  <path d="M120 88v57" fill="none" stroke="#BFDBFE" stroke-width="3" stroke-linecap="round"/>

  <!-- Study lines on the left page -->
  <path d="M78 101h27M78 112h27M78 123h19" fill="none" stroke="#93C5FD" stroke-width="4" stroke-linecap="round"/>

  <!-- Code brackets and slash on the right page -->
  <path d="m139 103-8 9 8 9m17-18 8 9-8 9m-4-20-7 22" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="260" y="145" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2.8">
    <tspan fill="#0F172A">M2</tspan><tspan fill="#2563EB">-Year2</tspan>
  </text>
</svg>
